# Chạy toàn hệ thống bằng 1 lệnh:   docker compose up --build
#   Giao diện:  http://localhost:3000        API: http://localhost:6969        AI Service: nội bộ (cổng 8001)
# Tài khoản demo: xem README gốc, mục "Chạy bằng Docker". Mặc định dùng bí mật DEMO; muốn đổi, copy .env.example -> .env.
# KHÔNG dùng cấu hình mặc định này để triển khai thật.
name: clinic-queue

services:
  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+07:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-demo_root_pw}
      MYSQL_DATABASE: ${DB_NAME:-clinic_queue}
      MYSQL_USER: ${DB_USER:-clinic}
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo_clinic_pw}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306" # chỉ máy này truy cập được, để xem dữ liệu bằng DBeaver/Workbench
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"] # chỉ dùng cho hàng đợi nhắc hẹn, không cần lưu đĩa
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai:
    build: ./ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-demo-ai-token}
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      ai: { condition: service_healthy }
    environment:
      # "demo": không bật các route CRUD của chế độ development, cookie không bắt buộc HTTPS (chạy http://localhost được),
      # CORS cho localhost/LAN. Triển khai thật dùng NODE_ENV=production + CORS_ORIGINS + HTTPS.
      NODE_ENV: ${APP_ENV:-demo}
      PORT: "6969"
      URL_REACT: ${WEB_URL:-http://localhost:3000}
      CORS_ORIGINS: ${WEB_URL:-http://localhost:3000}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DIALECT: mysql
      DB_USERNAME: ${DB_USER:-clinic}
      DB_PASSWORD: ${DB_PASSWORD:-demo_clinic_pw}
      DB_DATABASE_NAME: ${DB_NAME:-clinic_queue}
      JWT_SECRET: ${JWT_SECRET:-demo-jwt-secret-change-me-0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-demo-refresh-secret-change-me-fedcba9876543210}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-demo-ai-token}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@12345}
      # Tuỳ chọn (để trống thì tính năng tương ứng tự tắt): gửi email, thanh toán PayOS, push thông báo
      EMAIL_APP: ${EMAIL_APP:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    ports:
      - "${API_PORT:-6969}:6969"
    volumes:
      - uploads:/app/build/public/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Chạy trong TRÌNH DUYỆT, phải là địa chỉ API mà trình duyệt truy cập được (không phải "api")
        REACT_APP_BACKEND_URL: ${PUBLIC_API_URL:-http://localhost:6969}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
        REACT_APP_FACEBOOK_APP_ID: ${REACT_APP_FACEBOOK_APP_ID:-}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
